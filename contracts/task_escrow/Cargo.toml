[package]
name = "task_escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh = "1.8"
near-sdk = { version = "5", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "5", features = ["legacy", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
